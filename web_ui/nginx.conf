server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;          # DNS embutido do Docker (o agente pode subir depois do nginx)
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location /api/ {
        set $agente http://agente:8000;
        proxy_pass $agente;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri /index.html; }
}
