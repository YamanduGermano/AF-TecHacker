<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Laboratório local de investigação supervisionada. Sínteses, evidências e decisões em um só lugar.">
  <title>Laboratório · Tecnologias Hackers</title>
  <link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="/"><span class="brand-mark">L<span>·</span></span><span>Laboratório<small>TECNOLOGIAS HACKERS</small></span></a>
      <div class="sidebar-label">ÁREA DE TRABALHO</div>
      <nav id="navigation"></nav>
      <div class="session-heading"><span class="sidebar-label">SESSÕES</span><button class="icon-button" data-action="new" aria-label="Nova sessão">+</button></div>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-bottom">
        <div class="local-note"><span class="dot"></span> Ambiente local <small>Você conduz. A IA auxilia.</small></div>
        <button class="settings-button" data-action="settings"><span data-icon="settings"></span> Recursos e configurações</button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="session-title">Nova exploração</strong></div><div class="topbar-right"><span class="supervision" data-icon="shield"></span><span>Supervisão humana</span><span class="avatar">TH</span></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="footer"><span>Ollama + ferramentas do seu computador</span><span>Nenhuma execução sem sua aprovação</span></footer>
    </div>
  </div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
